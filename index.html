<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rule 30</title>
  <script src="./index.js" type="module"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Rule 30</h1>
  <main>
    <div>
      <canvas id="canvas" height="800" width="800" tabindex="1"></canvas>
    </div>
    <ui-grid>
      <button id="play">Play</button>
      <button id="reset">Reset</button>

      <label id="speed-label" for="speed" title="Sets the rows per second">Speed</label>
      <input type="range" id="speed" value="0.5" min="0" max="1" step="any">

      <h3>Rule Options</h3>

      <label for="rule" title="Sets the CA rule">Rule</label>
      <input type="number" id="rule" value="30">

      <label for="boundary" title="Sets the boundary condition">Boundary</label>
      <select id="boundary">
        <option value="off">Assume Off</option>
        <option value="on">Assume On</option>
        <option value="wrap">Wrap Around</option>
      </select>

      <h3>Canvas Options</h3>

      <label for="lock-internal-size" title="If checked, locks the internal size to the external size">Lock
        internal size</label>
      <input type="checkbox" id="lock-internal-size" checked="true">

      <label for="internal-width" title="Sets the internal width">Internal Width</label>
      <input type="number" id="internal-width" value="800">

      <label for="internal-height" title="Sets the internal height">Internal Height</label>
      <input type="number" id="internal-height" value="800">

      <label for="lock-aspect-ratio" title="If checked, locks the aspect ratio of the external size to be a square">Lock
        aspect ratio</label>
      <input type="checkbox" id="lock-aspect-ratio" checked="true">

      <label for="external-width" title="Sets the external width">External Width</label>
      <input type="number" id="external-width" value="800">

      <label for="external-height" title="Sets the external height">External Height</label>
      <input type="number" id="external-height" value="800">
    </ui-grid>
  </main>
</body>
