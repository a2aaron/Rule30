<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rule 30</title>
  <script src="./index.js" type="module"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Rule 30</h1>
  <main>
    <div>
      <canvas id="canvas" height="1000" width="1000" tabindex="1"></canvas>
    </div>
    <ui-grid>
      <h3>Rule Options</h3>

      <label for="rule" title="Sets the CA rule">Rule</label>
      <input type="number" id="rule" value="30">

      <h3>Canvas Options</h3>
      <label for="width" title="Sets the cell width">Width</label>
      <input type="number" id="width" value="1000">

      <label for="height" title="Sets the cell height">Height</label>
      <input type="number" id="height" value="1000">
    </ui-grid>
  </main>
</body>
