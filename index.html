<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rule 30</title>
  <script src="./index.js" type="module"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Rule 30</h1>
  <main>
    <div>
      <canvas id="canvas" height="700" width="700" tabindex="1"></canvas>
    </div>
    <ui-grid>
      <h3>Rule Options</h3>

      <label for="rule" title="Sets the CA rule">Rule</label>
      <input type="number" id="rule" value="30">

      <h3>Canvas Options</h3>
      <label for="rows" title="Sets the number of rows">Rows</label>
      <input type="number" id="rows" value="512">

      <label for="x-scale" title="Sets x-axis scaling">X Scale</label>
      <input type="number" id="x-scale" value="2" step="0.5">

      <label for="y-scale" title="Sets x-axis scaling">Y Scale</label>
      <input type="number" id="y-scale" value="2" step="0.5">
    </ui-grid>
  </main>
</body>
