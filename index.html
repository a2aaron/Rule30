<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rule 30</title>
  <script src="./index.js" type="module"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Rule 30</h1>
  <main>
    <div>
      <canvas id="canvas" height="800" width="800" tabindex="1"></canvas>
      <p id="copied-to-clipboard-message">Copied to clipboard</p>
    </div>
    <ui-grid>
      <h3>Animation Options</h3>
      <ui-row>
        <button id="play">Play</button>
        <button id="reset">Reset</button>
      </ui-row>

      <label id="speed-label" for="speed" title="Sets the rows per second">Speed</label>
      <input type="range" id="speed" value="0.5" min="0" max="1" step="any">

      <h3>Randomization Options</h3>
      <ui-row>
        <button id="inject-randomness">Randomize Row</button>
      </ui-row>

      <label for="randomness-type" title="Sets the randomness type">Randomness Type</label>
      <select id="randomness-type">
        <option value="state_0">Set State 0</option>
        <option value="state_1">Set State 1</option>
        <option value="state_2">Set State 2</option>
        <option value="replace">Replace</option>
        <option value="cycle">Cycle</option>
      </select>

      <label id="randomness-label" for="randomness-amount"
             title="Sets the percent of cells to randomy turn on">Randomness</label>
      <input type="range" id="randomness-amount" value="0.5" min="0" max="1" step="any">

      <label for="randomize-if-boring"
             title="Automatically randomizes when the current row is all the same color">Auto-Randomize</label>
      <input type="checkbox" id="randomize-if-boring">
      <h3>Rule Options</h3>
      <ui-row>
        <button id="randomize-rule">Randomize</button>
        <button id="flip-rule">Flip</button>
        <button id="complement-rule">Complement</button>
        <button id="cycle-rule">Cycle</button>
      </ui-row>
      <template id="rule-diagram">
        <rule-diagram>
          <rule-box></rule-box>
          <rule-box></rule-box>
          <rule-box></rule-box>
          <rule-input></rule-input>
          </checkbox-caption>
      </template>
      <ui-row>
        <details open="true">
          <summary>Show / Hide Rules</summary>
          <rule-diagrams></rule-diagrams>
        </details>
      </ui-row>

      <label for="rule" title="Sets the CA rule">Rule</label>
      <input type="number" id="rule" value="30">

      <label for="inital" title="Sets the initial conditions">Initial Row</label>
      <select id="initial">
        <option value="one_cell_on_center">One Cell On (Center)</option>
        <option value="one_cell_on_left">One Cell On (Left)</option>
        <option value="one_cell_on_right">One Cell On (Right)</option>
        <option value="one_cell_on_random">One Cell On (Random)</option>
        <option value="random_25">Random (5%)</option>
        <option value="random_25">Random (25%)</option>
        <option value="random_50">Random (50%)</option>
        <option value="random_75">Random (75%)</option>
        <option value="random_75">Random (95%)</option>
        <option value="one_cell_off_center">One Cell Off (Center)</option>
        <option value="one_cell_off_left">One Cell Off (Left)</option>
        <option value="one_cell_off_right">One Cell Off (Right)</option>
        <option value="one_cell_off_random">One Cell On (Random)</option>
        <option value="all_on">All On</option>
        <option value="all_off">All Off</option>
      </select>

      <label for="boundary" title="Sets the boundary condition">Boundary</label>
      <select id="boundary">
        <option value="wrap">Wrap Around</option>
        <option value="off">Assume Off</option>
        <option value="on">Assume On</option>
      </select>

      <h3>Canvas Options</h3>
      <button id="randomize-all-colors">Randomize Colors</button>

      <label for="color-state-0" title="Color for state 0 / off">State 0 Color</label>
      <ui-group>
        <input type="color" id="color-state-0" value="black">
        <button id="randomize-color-state-0">Randomize</button>
      </ui-group>

      <label for="color-state-1" title="Color for state 1 / on">State 1 Color</label>
      <ui-group>
        <input type="color" id="color-state-1" value="white">
        <button id="randomize-color-state-1">Randomize</button>
      </ui-group>

      <label for="color-state-2" title="Color for state 1 / on">State 2 Color</label>
      <ui-group>
        <input type="color" id="color-state-2" value="red">
        <button id="randomize-color-state-2">Randomize</button>
      </ui-group>

      <label for="lock-internal-size" title="If checked, locks the internal size to the external size">Lock
        internal size</label>
      <input type="checkbox" id="lock-internal-size">

      <label title="Sets the internal size">Internal Size</label>
      <ui-group>
        <input type="number" id="internal-width" value="300" min="1" max="9999" class="narrow-input">
        x
        <input type="number" id="internal-height" value="300" min="1" max="9999" class="narrow-input">
      </ui-group>

      <label for="lock-aspect-ratio" title="If checked, locks the aspect ratio of the external size to be a square">Lock
        aspect ratio</label>
      <input type="checkbox" id="lock-aspect-ratio" checked="true">

      <label for="external-width" title="Sets the external size">External Size</label>
      <ui-group>
        <input type="number" id="external-width" value="900" min="1" max="9999" class="narrow-input">
        x
        <input type="number" id="external-height" value="900" min="1" max="9999" class="narrow-input">
      </ui-group>

    </ui-grid>
  </main>
</body>
